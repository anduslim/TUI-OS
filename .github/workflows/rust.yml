# TUI OS v2 (Rust): tests, the tuiosd server binary, and the Boox APK.
#
# Every push/PR touching rust/ builds both and uploads them as artifacts.
# Release (both files on one GitHub Release, tag tuios2-vX.Y.Z, kept apart
# from v1's vX.Y.Z tags):
#   Actions tab -> "TUI OS v2 (Rust)" -> Run workflow -> release: 0.1.0
#
# Signing reuses v1's permanent key (secrets ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
# ANDROID_CERT_SHA256). Without them (forks) the APK gets a debug key.
name: TUI OS v2 (Rust)

on:
  push:
    branches: ["main", "claude/**"]
    paths: ["rust/**", ".github/workflows/rust.yml", "assets/fonts/**"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml", "assets/fonts/**"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish GitHub Release tuios2-v<version> (e.g. 0.1.0). Empty = artifacts only."
        required: false
        default: ""

concurrency:
  group: rust-${{ github.ref }}-${{ github.event_name }}-${{ inputs.release }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  tuiosd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: musl
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Static tuiosd for the Olares One
        run: |
          cargo build --release -p tuiosd --target x86_64-unknown-linux-musl
          mkdir -p ../dist
          cp target/x86_64-unknown-linux-musl/release/tuiosd ../dist/tuiosd-x86_64-linux
          file ../dist/tuiosd-x86_64-linux
          ../dist/tuiosd-x86_64-linux --version
          (cd ../dist && sha256sum tuiosd-x86_64-linux > tuiosd-x86_64-linux.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: tuiosd
          path: dist/*
          if-no-files-found: error

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      cert_sha256: ${{ steps.verify.outputs.cert_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: android
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked --version ^4

      - name: Version
        id: version
        run: |
          v="${{ inputs.release }}"
          [[ -z "$v" ]] && v="0.1.0-dev.${{ github.run_number }}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Rust core (libtuios_android.so)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: cargo ndk -t arm64-v8a -P 30 -o android/app/src/main/jniLibs build --release -p tuios-android

      - name: Signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_B64" ]]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "TUIOS_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing secrets: the APK uses a debug key and cannot update a release build."
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build APK
        working-directory: rust/android
        env:
          TUIOS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TUIOS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TUIOS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Verify signature
        id: verify
        env:
          EXPECTED_CERT: ${{ steps.signing.outputs.mode == 'release' && secrets.ANDROID_CERT_SHA256 || '' }}
        run: |
          set -euo pipefail
          mkdir -p ../dist
          name="tuios2-${{ steps.version.outputs.version }}-arm64-v8a.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "../dist/$name"
          bt="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          "$bt/zipalign" -c -p 4 "../dist/$name"
          "$bt/apksigner" verify --print-certs "../dist/$name" | tee /tmp/certs.txt
          cert="$(grep -m1 'SHA-256 digest' /tmp/certs.txt | awk '{print $NF}')"
          if [[ -n "$EXPECTED_CERT" && "${cert,,}" != "$(echo "${EXPECTED_CERT,,}" | tr -d ':[:space:]')" ]]; then
            echo "::error::APK signed with $cert, expected $EXPECTED_CERT"; exit 1
          fi
          unzip -l "../dist/$name" | grep -q 'lib/arm64-v8a/libtuios_android.so' || { echo "::error::Rust core missing from APK"; exit 1; }
          echo "cert_sha256=$cert" >> "$GITHUB_OUTPUT"
          (cd ../dist && sha256sum "$name" > "$name.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: tuios2-apk
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release != ''
    needs: [test, tuiosd, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: tuios2-v${{ inputs.release }}
          target_commitish: ${{ github.sha }}
          name: TUI OS v2 ${{ inputs.release }} (Rust)
          prerelease: true
          files: dist/*
          body: |
            **TUI OS v2 ${{ inputs.release }}**: Rust server (`tuiosd`) for the Olares One and thin client APK for the Boox (installs beside v1 as `org.olares.tuios2`).

            * `tuiosd-x86_64-linux`: static binary for the Olares One. See `rust/README.md` for setup.
            * `tuios2-${{ inputs.release }}-arm64-v8a.apk`: Boox app. APK certificate SHA-256: `${{ needs.apk.outputs.cert_sha256 }}`.
