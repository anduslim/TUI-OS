name: Tests

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_call:  # release gate in apk.yml

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # the CPython python-for-android ships
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: buildozer.spec requirements resolve together
        run: |
          python tools/spec_requirements.py > /tmp/apk-reqs.txt
          cat /tmp/apk-reqs.txt
          pip install --dry-run --ignore-installed -r /tmp/apk-reqs.txt
      - name: Java helper compiles (WebView)
        run: python tools/check_java.py
