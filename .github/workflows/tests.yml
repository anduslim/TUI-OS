name: Tests

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # the CPython python-for-android ships
      - run: pip install -e '.[dev]'
      - run: pytest -q
