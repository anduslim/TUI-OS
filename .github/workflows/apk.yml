# Android APK: build on PRs and main (artifact), publish GitHub Releases.
#
# Two ways to release (both: tests -> APK -> GitHub Release with the APK):
#   * Actions tab -> "Android APK" -> Run workflow -> release: 1.1.0
#     (creates the tag v1.1.0 on the selected commit)
#   * git tag v1.1.0 && git push origin v1.1.0
#
# Signing: add these repository secrets for a release-signed APK with a
# stable key (needed for in-place updates across releases):
#   ANDROID_KEYSTORE_BASE64   base64 of the .keystore/.jks file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the release carries a debug-signed APK (installable, but each
# CI keystore differs, so updating may require uninstalling first).
name: Android APK

on:
  pull_request:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release for this version (e.g. 1.1.0). Empty = build artifact only."
        required: false
        default: ""

concurrency:
  group: apk-${{ github.ref }}-${{ github.event_name }}-${{ inputs.release }}
  cancel-in-progress: true

jobs:
  tests:
    if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != ''))
    uses: ./.github/workflows/tests.yml

  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    outputs:
      apk_name: ${{ steps.collect.outputs.apk_name }}
      signed: ${{ steps.signing.outputs.signed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: System packages for python-for-android
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool pkg-config cmake \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            libffi-dev libssl-dev

      - name: Rust target for the cryptography recipe (SSH)
        run: rustup target add aarch64-linux-android

      - name: Buildozer
        run: pip install --upgrade buildozer "cython<3.1" virtualenv

      - name: Cache SDK / NDK / p4a dists
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}-v2
          restore-keys: buildozer-

      - name: Drop p4a's throwaway pip venv from the cache
        # Recreating it over a cached copy mixes two pip versions
        # (ImportError: capture_logging). It is rebuilt in seconds.
        run: rm -rf .buildozer/android/platform/build-*/build/venv

      - name: Version
        id: version
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          if [[ -n "$RELEASE_INPUT" ]]; then
            v="${RELEASE_INPUT#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(sed -n 's/^version = //p' buildozer.spec)"
          fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Signing keystore
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          IS_RELEASE: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')) }}
        run: |
          if [[ -n "$KEYSTORE_B64" && "$IS_RELEASE" == "true" ]]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "P4A_RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            yes | buildozer android release
          else
            yes | buildozer android debug
          fi

      - name: Collect APK
        id: collect
        run: |
          mkdir -p dist
          src="$(ls -t bin/*.apk | head -1)"
          kind=$([[ "${{ steps.signing.outputs.signed }}" == "true" ]] && echo release || echo debug)
          name="olares-workspace-tui-${{ steps.version.outputs.version }}-arm64-v8a-${kind}.apk"
          cp "$src" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          echo "apk_name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: olares-workspace-tui-apk
          path: dist/*
          if-no-files-found: error

  release:
    if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != ''))
    needs: [tests, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: olares-workspace-tui-apk
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Olares Workspace TUI v${{ needs.apk.outputs.version }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(needs.apk.outputs.version, '-') }}
          body: |
            **Olares Workspace TUI v${{ needs.apk.outputs.version }}**: native Android APK for the Onyx Boox Tab Ultra C (arm64-v8a, Android 11+).

            Install: download `${{ needs.apk.outputs.apk_name }}`, then `adb install -r <apk>` or open it on the tablet.
            Signing: ${{ needs.apk.outputs.signed == 'true' && 'release keystore' || 'debug key (add the ANDROID_KEYSTORE_* secrets for stable release signing)' }}.
            Checksum: see the `.sha256` file.
