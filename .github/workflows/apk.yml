# Android APK: build on PRs and main (artifact), publish GitHub Releases.
#
# Two ways to release (both: tests -> APK -> GitHub Release with the APK):
#   * Actions tab -> "Android APK" -> Run workflow -> release: 1.1.0
#     (creates the tag v1.1.0 on the selected commit)
#   * git tag v1.1.0 && git push origin v1.1.0
#
# Signing (README: Signing): run tools/create_signing_key.sh --upload once to
# create your permanent key and store it as repository secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD, and optionally ANDROID_CERT_SHA256 (pins the key).
# Every APK is a signed release build checked by tools/verify_apk.sh.
name: Android APK

on:
  pull_request:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release for this version (e.g. 1.1.0). Empty = build artifact only."
        required: false
        default: ""

concurrency:
  group: apk-${{ github.ref }}-${{ github.event_name }}-${{ inputs.release }}
  cancel-in-progress: true

jobs:
  tests:
    if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != ''))
    uses: ./.github/workflows/tests.yml

  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    outputs:
      # apk_name is not used across jobs: it contains the key alias, which is a
      # secret, so GitHub drops it from job outputs ("may contain secret").
      apk_name: ${{ steps.collect.outputs.apk_name }}
      signing: ${{ steps.signing.outputs.mode }}
      cert_sha256: ${{ steps.verify.outputs.cert_sha256 }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: System packages for python-for-android
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool pkg-config cmake \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            libffi-dev libssl-dev

      - name: Rust target for the cryptography recipe (SSH)
        run: rustup target add aarch64-linux-android

      - name: Buildozer
        run: pip install --upgrade buildozer "cython<3.1" virtualenv

      - name: Cache SDK / NDK / p4a dists
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}-v2
          restore-keys: buildozer-

      - name: Drop p4a's throwaway pip venv from the cache
        # Recreating it over a cached copy mixes two pip versions
        # (ImportError: capture_logging). It is rebuilt in seconds.
        run: rm -rf .buildozer/android/platform/build-*/build/venv

      - name: Rebuild cryptography and the dist with the local recipe
        # A cached build of cryptography from p4a's own recipe lacks the
        # libpython link (recipes/cryptography). p4a reuses cached recipe
        # builds and dists, so drop them; tools/check_native_libs.sh then
        # proves the APK has the fix.
        run: |
          rm -rf .buildozer/android/platform/build-*/build/other_builds/cryptography* \
                 .buildozer/android/platform/build-*/build/python-installs/*/*/cryptography* \
                 .buildozer/android/platform/build-*/dists

      - name: Version
        id: version
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          if [[ -n "$RELEASE_INPUT" ]]; then
            v="${RELEASE_INPUT#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(sed -n 's/^version = //p' buildozer.spec)"
          fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Signing key
        id: signing
        # Every build is a signed, non-debuggable RELEASE build:
        #   release   main / manual / tag runs with the ANDROID_* secrets: your
        #             permanent key, so each APK installs over the previous one
        #   ephemeral PRs, or before the secrets exist: a throwaway key made in
        #             this job (installable for testing, not updatable)
        # A GitHub Release refuses to publish without your key.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IS_RELEASE: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')) }}
        run: |
          ks="$RUNNER_TEMP/release.keystore"
          if [[ -n "$KEYSTORE_B64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" \
                && "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
            {
              echo "P4A_RELEASE_KEYSTORE=$ks"
              echo "P4A_RELEASE_KEYSTORE_PASSWD=$KEYSTORE_PASSWORD"
              echo "P4A_RELEASE_KEYALIAS=$KEY_ALIAS"
              echo "P4A_RELEASE_KEYALIAS_PASSWD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "mode=release" >> "$GITHUB_OUTPUT"
          elif [[ "$IS_RELEASE" == "true" ]]; then
            echo "::error::Releases must be signed with your permanent key, or installed copies can't be updated."
            echo "::error::Run tools/create_signing_key.sh --upload once (see README: Signing), then re-run this release."
            exit 1
          else
            pw="$(openssl rand -hex 24)"
            echo "::add-mask::$pw"
            keytool -genkeypair -keystore "$ks" -storetype PKCS12 -storepass "$pw" -keypass "$pw" \
              -alias ci -keyalg RSA -keysize 2048 -validity 30 \
              -dname "CN=TUI-OS ephemeral CI key (test builds only)" 2>/dev/null
            {
              echo "P4A_RELEASE_KEYSTORE=$ks"
              echo "P4A_RELEASE_KEYSTORE_PASSWD=$pw"
              echo "P4A_RELEASE_KEYALIAS=ci"
              echo "P4A_RELEASE_KEYALIAS_PASSWD=$pw"
            } >> "$GITHUB_ENV"
            echo "mode=ephemeral" >> "$GITHUB_OUTPUT"
            echo "::warning::Signed with a throwaway key: installable for testing, but it can't update other builds. Add the ANDROID_* secrets (README: Signing)."
          fi

      - name: Build APK (release, signed)
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
        run: yes | buildozer android release

      - name: Collect APK
        id: collect
        run: |
          mkdir -p dist
          src="$(ls -t bin/*.apk | head -1)"
          suffix=$([[ "${{ steps.signing.outputs.mode }}" == "release" ]] && echo "" || echo "-ephemeral")
          name="olares-workspace-tui-${{ steps.version.outputs.version }}-arm64-v8a${suffix}.apk"
          cp "$src" "dist/$name"
          echo "apk_name=$name" >> "$GITHUB_OUTPUT"

      - name: Verify signature (as Android will)
        id: verify
        env:
          EXPECTED_CERT: ${{ steps.signing.outputs.mode == 'release' && secrets.ANDROID_CERT_SHA256 || '' }}
        run: |
          tools/verify_apk.sh "dist/${{ steps.collect.outputs.apk_name }}" "$EXPECTED_CERT"
          tools/check_native_libs.sh "dist/${{ steps.collect.outputs.apk_name }}"
          (cd dist && sha256sum "${{ steps.collect.outputs.apk_name }}" > "${{ steps.collect.outputs.apk_name }}.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: olares-workspace-tui-apk
          path: dist/*
          if-no-files-found: error

  release:
    if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != ''))
    needs: [tests, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: olares-workspace-tui-apk
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Olares Workspace TUI v${{ needs.apk.outputs.version }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(needs.apk.outputs.version, '-') }}
          body: |
            **Olares Workspace TUI v${{ needs.apk.outputs.version }}**: native Android APK for the Onyx Boox Tab Ultra C (arm64-v8a, Android 11+).

            **Install:** download `olares-workspace-tui-${{ needs.apk.outputs.version }}-arm64-v8a.apk`, then `adb install -r <apk>`, or open it on the tablet (allow your file manager to *install unknown apps*).
            **Signing:** release key, verified with `apksigner` (v1+v2, not debuggable).
            Certificate SHA-256: `${{ needs.apk.outputs.cert_sha256 }}`. Every release is signed with this same key, so updates install over the previous version.
            **Checksum:** see the `.sha256` file.
