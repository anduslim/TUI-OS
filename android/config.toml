# Bundled into the APK and copied to the app's private storage on first
# launch (TUI_OS_CONFIG points at that copy). Edit before building.
# Keys and defaults: see tui_os/config.py and README.md.

olares_host = "192.168.1.50"
ollama_model = "llama3.1:8b"
telemetry_interval = 5
stream_flush_interval = 0.35
demo_mode = false

# LLM server. "ollama" (default) uses /api/generate on ollama_url.
# "openai" talks to any OpenAI-compatible server, e.g. the Olares
# llama.cpp Engine app (llama-server), vLLM, LM Studio or Ollama's /v1.
# llm_api = "openai"
# llm_url = "http://192.168.1.50:8080"
# llm_model = ""        # empty = the model the server has loaded
# llm_api_key = ""

# Mail tab: Gmail over IMAP/SMTP. Use an app password from
# https://myaccount.google.com/apppasswords (needs 2-Step Verification),
# never your Google password. Empty = demo mailbox.
# mail_address = "you@gmail.com"
# mail_password = "abcd efgh ijkl mnop"
# mail_name = "Your Name"
#
# Calendar tab: Google Calendar > Settings > (your calendar) >
# "Secret address in iCal format". Read-only. Empty = demo calendar.
# ical_url = "https://calendar.google.com/calendar/ical/.../basic.ics"
#
# Better: keep the two secrets above in Vaultwarden (item "TUI-OS": login =
# Gmail address + app password, custom field ical_url) and only set these.
# The TUI asks for the master password at launch. See README.
# vault_url = "https://vaultwarden.you.olares.com"
# vault_email = "you@example.com"
#
# To change settings without rebuilding, push an override file:
#   adb push config.toml /sdcard/Android/data/org.olares.olares_workspace_tui/files/

# Tab 1 is an SSH shell on the node; tab 6 is the LLM terminal.
# start_tab = "shell"
# shell_user = "olares"
# shell_command = "tmux new -A -s main"
